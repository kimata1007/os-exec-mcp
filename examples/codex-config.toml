[mcp_servers.os-batch]
command = "node"
args = ["/absolute/path/to/os-batch-mcp/dist/mcp/stdio.js"]
cwd = "/absolute/path/to/workspace"
startup_timeout_sec = 10.0
tool_timeout_sec = 70.0
required = false

[mcp_servers.os-batch.env]
OS_BATCH_POLICY_FILE = "/absolute/path/to/os-batch-mcp/examples/policy.development.json"
OS_BATCH_WORKSPACE_ROOT = "/absolute/path/to/workspace"
