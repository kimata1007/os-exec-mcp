    .subtitle, .legend, .detail, .axis { font-size: 13px; fill: #536075; }
    .row-label, .value { font-size: 13px; }
    .grid { stroke: #d7dde7; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #eef2f8; }
      .subtitle, .legend, .detail, .axis { fill: #aab4c5; }
      .grid { stroke: #455065; }
    }
  </style>
