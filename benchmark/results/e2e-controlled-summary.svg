<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Repository-to-GitHub-Pages benchmark</title>
  <desc id="description">End-to-end duration for each AI agent trial. Solid bars show time through Pages configuration, translucent bars show publication wait, orange bars show observed tool-active wall time, and vertical markers show agent exit.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle, .summary { font-size: 13px; fill: #536075; }
    .row-label, .value, .tool-value { font-size: 12px; }
    .tool-value { fill: #8a5600; }
    .axis { font-size: 12px; fill: #5d687a; }
    .grid { stroke: #d7dde7; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #eef2f8; }
      .subtitle, .summary, .axis { fill: #aab4c5; }
      .tool-value { fill: #fbbf24; }
      .grid { stroke: #455065; }
    }
  </style>
  <text class="title" x="260" y="34">Whole task: empty directory to live GitHub Pages URL</text>
  <text class="subtitle" x="260" y="56">Solid: through Pages configuration · translucent: publication wait · orange: observed tool-active time · marker: agent exit</text>
  <text class="summary" x="260" y="78">Codex standard execution: 1/1 success, p50 6.25 min</text><text class="summary" x="590" y="78">Codex with os-batch MCP: 1/1 success, p50 6.21 min</text>

    <line class="grid" x1="260" x2="260" y1="112" y2="358" />
    <text class="axis" x="260" y="380" text-anchor="middle">0.0 min</text>
    <line class="grid" x1="405.8333333333333" x2="405.8333333333333" y1="112" y2="358" />
    <text class="axis" x="405.8333333333333" y="380" text-anchor="middle">1.3 min</text>
    <line class="grid" x1="551.6666666666666" x2="551.6666666666666" y1="112" y2="358" />
    <text class="axis" x="551.6666666666666" y="380" text-anchor="middle">2.7 min</text>
    <line class="grid" x1="697.5" x2="697.5" y1="112" y2="358" />
    <text class="axis" x="697.5" y="380" text-anchor="middle">4.0 min</text>
    <line class="grid" x1="843.3333333333333" x2="843.3333333333333" y1="112" y2="358" />
    <text class="axis" x="843.3333333333333" y="380" text-anchor="middle">5.3 min</text>
    <line class="grid" x1="989.1666666666666" x2="989.1666666666666" y1="112" y2="358" />
    <text class="axis" x="989.1666666666666" y="380" text-anchor="middle">6.7 min</text>
    <line class="grid" x1="1135" x2="1135" y1="112" y2="358" />
    <text class="axis" x="1135" y="380" text-anchor="middle">8.0 min</text>

    <text class="row-label" x="246" y="148" text-anchor="end">baseline-controlled-01</text>
    <rect x="260" y="130" width="643.41484375" height="24" fill="#2563eb" opacity="0.9" />
    <rect x="903.41484375" y="130" width="40.707552083333326" height="24" fill="#2563eb" opacity="0.35" />
    <rect x="260" y="160" width="305.17447916666663" height="8" fill="#f59e0b" rx="4" />
    <text class="tool-value" x="573.1744791666666" y="169">tools 2.79 min</text>
    <path d="M1040.3140625,127 V157" stroke="currentColor" stroke-width="2" />
    <text class="value" x="952.1223958333333" y="148">6.25 min</text>
    <text class="row-label" x="246" y="208" text-anchor="end">mcp-controlled-01</text>
    <rect x="260" y="190" width="641.4059895833334" height="24" fill="#7c3aed" opacity="0.9" />
    <rect x="901.4059895833334" y="190" width="37.95677083333334" height="24" fill="#7c3aed" opacity="0.35" />
    <rect x="260" y="220" width="249.92552083333334" height="8" fill="#f59e0b" rx="4" />
    <text class="tool-value" x="517.9255208333334" y="229">tools 2.29 min</text>
    <path d="M1008.4330729166667,187 V217" stroke="currentColor" stroke-width="2" />
    <text class="value" x="947.3627604166667" y="208">6.21 min</text>
</svg>
